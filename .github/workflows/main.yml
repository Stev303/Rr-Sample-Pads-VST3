name: Build Rr Sample Pads VST3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release --target RrSamplePads_VST3 --parallel 2
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (!$plugin) { throw "VST3 bundle was not generated." }
          Compress-Archive -Path $plugin.FullName -DestinationPath "Rr-Sample-Pads-VST3-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Rr-Sample-Pads-VST3-Windows-x64
          path: Rr-Sample-Pads-VST3-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
